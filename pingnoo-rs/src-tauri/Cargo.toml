[package]
name = "pingnoo-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pingnoo — Tauri desktop shell."

[lib]
name = "pingnoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pingnoo-core = { workspace = true }
pingnoo-engine = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Windows: suspend the WebView2 renderer when minimized (versions match the
# webview2-com that tauri/wry already pull in, so the COM types line up).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
